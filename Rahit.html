<!DOCTYPE html>
<html>
<head>
<title>Birthday Surprise 🎉</title>
<style>
body {
  text-align: center;
  background: black;
  color: white;
  overflow: hidden;
}

#gift {
  font-size: 80px;
  cursor: pointer;
  margin-top: 100px;
  animation: bounce 1s infinite;
}

@keyframes bounce {
  0%,100% {transform: translateY(0);}
  50% {transform: translateY(-20px);}
}

#cake {
  display: none;
  margin-top: 50px;
}

#message {
  display: none;
  font-size: 24px;
  margin-top: 20px;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
}
</style>
</head>

<body>

<h1>Click the Gift 🎁</h1>

<div id="gift" onclick="openGift()">🎁</div>

<div id="cake">
  <h2>🎂 Happy Birthday Dear Friend 🎉</h2>
  <div style="font-size:60px;">🎂 🕯️</div>
</div>

<div id="message">
  Tu chahe mujhse baat kare ya na kare… ❤️  
  Par tu meri life ka important part hai 😊
</div>

<canvas id="fireworks"></canvas>

<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>
function openGift() {
  document.getElementById("gift").style.display = "none";
  document.getElementById("cake").style.display = "block";
  document.getElementById("message").style.display = "block";
  document.getElementById("music").play();
  startFireworks();
}

// Fireworks animation
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function createFirework() {
  for (let i = 0; i < 100; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      speedX: (Math.random() - 0.5) * 6,
      speedY: (Math.random() - 0.5) * 6,
      life: 100
    });
  }
}

function startFireworks() {
  setInterval(createFirework, 800);
  animate();
}

function animate() {
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach((p, i) => {
    p.x += p.speedX;
    p.y += p.speedY;
    p.life--;

    ctx.fillStyle = "hsl(" + Math.random()*360 + ",100%,50%)";
    ctx.fillRect(p.x, p.y, 3, 3);

    if (p.life <= 0) particles.splice(i, 1);
  });

  requestAnimationFrame(animate);
}
</script>

</body>
</html>
