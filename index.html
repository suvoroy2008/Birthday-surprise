<!DOCTYPE html>
<html>
<head>
<title>Birthday Surprise 🎉</title>
<style>
body {
  text-align: center;
  background: black;
  color: white;
  overflow: hidden;
  font-family: Arial;
}

#gift {
  font-size: 80px;
  cursor: pointer;
  margin-top: 100px;
  animation: bounce 1s infinite;
  position: relative;
  z-index: 10;
}

@keyframes bounce {
  0%,100% {transform: translateY(0);}
  50% {transform: translateY(-20px);}
}

#name, #cake, #message {
  display: none;
}

#name {
  font-size: 40px;
  margin-top: 20px;
  color: cyan;
  text-shadow: 0 0 10px cyan, 0 0 20px cyan;
}

#cake {
  margin-top: 20px;
}

#message {
  font-size: 22px;
  margin-top: 20px;
  padding: 10px;
  max-width: 90%;
  margin-left: auto;
  margin-right: auto;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<h1>Click the Gift 🎁</h1>

<div id="gift" onclick="openGift()">🎁</div>

<div id="name"></div>

<div id="cake">
  <h2>🎂 Happy Birthday 🎉</h2>
  <div style="font-size:60px;">🎂 🕯️</div>
</div>

<div id="message"></div>

<canvas id="fireworks"></canvas>

<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>
function openGift() {
  document.getElementById("gift").style.display = "none";
  document.getElementById("name").style.display = "block";
  document.getElementById("cake").style.display = "block";
  document.getElementById("message").style.display = "block";

  document.getElementById("music").play();

  typeName();
  typeMessage();

  // fireworks 3 sec baad start
  setTimeout(() => {
    startFireworks();
  }, 3000);
}

// 🎉 Name typing
let nameText = "🎉 Happy Birthday Rahit 🎉";
let i = 0;
function typeName() {
  if (i < nameText.length) {
    document.getElementById("name").innerHTML += nameText.charAt(i);
    i++;
    setTimeout(typeName, 100);
  }
}

// ❤️ Shayari (3 minute typing)
let msg = `Dear Friend ❤️

Zindagi me kuch log dil ke bahut kareeb ho jaate hain,
Tu unme se ek hai 🙂

Har din khushiyon se bhara rahe,
Aur tera har sapna pura ho ✨

Chahe baat ho ya na ho,
Par meri dua hamesha tere saath rahe 🙏

Tu hamesha muskurata rahe 😊

🎂 Happy Birthday Rahit 🎉`;

let j = 0;
function typeMessage() {
  if (j < msg.length) {
    document.getElementById("message").innerHTML += msg.charAt(j);
    j++;
    setTimeout(typeMessage, 800); // slow typing (approx 3 min)
  }
}

// 🎆 Fireworks
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
let fireworkInterval;

function createFirework() {
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      speedX: (Math.random() - 0.5) * 5,
      speedY: (Math.random() - 0.5) * 5,
      life: 100
    });
  }
}

function startFireworks() {
  fireworkInterval = setInterval(createFirework, 1200);

  setTimeout(() => {
    clearInterval(fireworkInterval);
  }, 300000); // 5 minutes
  animate();
}

function animate() {
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach((p, i) => {
    p.x += p.speedX;
    p.y += p.speedY;
    p.life--;

    ctx.fillStyle = "hsl(" + Math.random()*360 + ",100%,50%)";
    ctx.fillRect(p.x, p.y, 3, 3);

    if (p.life <= 0) particles.splice(i, 1);
  });

  requestAnimationFrame(animate);
}
</script>

</body>
</html>
