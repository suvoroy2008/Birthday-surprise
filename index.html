<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise 🎉</title>

<style>
body {
  margin:0; text-align:center;
  background: radial-gradient(circle, #000428, #004e92);
  color:white; font-family:Arial;
}

/* 🎁 Gift */
#gift { font-size:80px; margin-top:100px; cursor:pointer; animation:bounce 1s infinite; }
@keyframes bounce {50%{transform:translateY(-20px);}}

/* Sections */
.section { display:none; margin-top:20px; animation:fade 1s; }
@keyframes fade {from{opacity:0;} to{opacity:1;}}

/* Slideshow */
#slider img {
  width:250px;
  border-radius:20px;
  margin-top:20px;
}

/* Fireworks */
.firework {
  position:fixed;
  width:5px; height:5px;
  background:white;
  animation:explode 1s ease-out infinite;
}
@keyframes explode {
  0%{transform:scale(1);}
  100%{transform:scale(20); opacity:0;}
}
</style>

</head>
<body>

<h1>Click the Gift 🎁</h1>
<div id="gift" onclick="openGift()">🎁</div>

<div id="main" class="section">

<h1>🎉 Happy Birthday Rahit 🎉</h1>

<h2 id="cake" onclick="blowCandle()">🎂🕯️ Click candle to blow 🕯️</h2>

<div id="message">
Dear Friend ❤️<br><br>
Tu meri life ka ek special part hai 🙂<br>
Teri smile hamesha bani rahe 😊<br>
Har sapna tera pura ho ✨<br><br>
🎂 Happy Birthday 🎉
</div>

<!-- 📸 Slideshow -->
<div id="slider">
<img id="slide" src="https://picsum.photos/300/200?1">
</div>

<br>

<!-- 🎵 Music button -->
<button onclick="playMusic()">▶️ Play Music 🎵</button>

</div>

<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

<script>
function openGift(){
  document.getElementById("gift").style.display="none";
  document.getElementById("main").style.display="block";
  startFireworks();
  startSlideshow();
}

// 🎂 Candle blow
function blowCandle(){
  document.getElementById("cake").innerHTML="🎂✨ Candles blown!";
}

// 🎵 Music
function playMusic(){
  document.getElementById("music").play();
}

// 📸 Slideshow
let images = [
"https://picsum.photos/300/200?1",
"https://picsum.photos/300/200?2",
"https://picsum.photos/300/200?3"
];
let i=0;
function startSlideshow(){
  setInterval(()=>{
    i=(i+1)%images.length;
    document.getElementById("slide").src=images[i];
  },2000);
}

// 🎆 Fireworks
function startFireworks(){
  setInterval(()=>{
    let fw=document.createElement("div");
    fw.className="firework";
    fw.style.top=Math.random()*100+"%";
    fw.style.left=Math.random()*100+"%";
    document.body.appendChild(fw);
    setTimeout(()=>fw.remove(),1000);
  },300);
}
</script>

</body>
</html>
