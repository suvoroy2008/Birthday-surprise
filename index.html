<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday 🎉</title>

<style>
body{
  text-align:center;
  background: linear-gradient(120deg, #000428, #004e92);
  color:white;
  font-family: Arial, "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}

/* 🎁 Gift */
#gift{
  font-size:80px;
  margin-top:100px;
  cursor:pointer;
  animation:bounce 1s infinite;
}
@keyframes bounce{
  50%{transform:translateY(-20px);}
}

/* Main */
#main{
  display:none;
}

/* 📸 Photo */
img{
  width:260px;
  border-radius:20px;
  margin-top:20px;
  box-shadow:0 0 20px cyan;
}

/* ❤️ Message */
p{
  font-size:20px;
  margin:20px;
  line-height:1.7;
  white-space:pre-line;
}
</style>

</head>

<body>

<h1>Click the Gift 🎁</h1>

<div id="gift" onclick="openGift()">🎁</div>

<div id="main">

<h1>🎉 Happy Birthday Rahit 🎂</h1>

<img id="photo" src="https://i.ibb.co/kVsbjz0b/photo1.jpg">

<p id="msg"></p>

</div>

<!-- 🎵 MUSIC -->
<audio id="music" preload="auto" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b30f51be6.mp3?filename=happy-birthday-254480.mp3" type="audio/mpeg">
</audio>

<script>

// 📸 Images (UPDATED)
let images = [
"https://i.ibb.co/kVsbjz0b/photo1.jpg",
"https://i.ibb.co/93g472H1/photo2.jpg",
"https://i.ibb.co/Pv8N9V86/photo3.jpg",
"https://i.ibb.co/Qvk3JjJH/photo4.jpg",
"https://i.ibb.co/234vhxML/photo5.jpg",
"https://i.ibb.co/MDV4CKyy/photo6.jpg",
"https://i.ibb.co/BHvtDP1Q/photo7.jpg"
];

// 🎁 Gift click
function openGift(){
  document.getElementById("gift").style.display="none";
  document.getElementById("main").style.display="block";

  let music = document.getElementById("music");

  music.muted = false;
  music.currentTime = 0;

  let playPromise = music.play();

  if (playPromise !== undefined) {
    playPromise.catch(() => {
      document.body.addEventListener("click", () => {
        music.play();
      }, { once: true });
    });
  }

  startSlideshow();
  typeMessage();
}

// 📸 Slideshow
let i=0;
function startSlideshow(){
  setInterval(()=>{
    i=(i+1)%images.length;
    document.getElementById("photo").src=images[i];
  },2000);
}

// ❤️ Message
let text = `Happy Birthday Rahit 🎂

Dear Friend, zindagi me kuch log dil ke bahut kareeb ho jaate hain… aur tu unme se ek hai ❤️ Shayad ye message unexpected ho, par dil ne aaj bhi tujhe wish karne se nahi roka.

Tu sirf dost nahi tha, meri aadat jaisa tha… isliye aaj bhi sab thoda adhura lagta hai. Jo bhi hua uska dukh hai, par humari yaadein usse zyada important hain 🙂

Har din tere liye khushiyon se bhara ho, tera har sapna pura ho… tu hamesha muskurata rahe ✨ Agar kabhi mauka mile, to main phir se wahi dosti jeena chahunga.

Happy Birthday ❤️`;

let j=0;
function typeMessage(){
  function type(){
    if(j<text.length){
      document.getElementById("msg").innerHTML += text.charAt(j);
      j++;
      setTimeout(type,25);
    }
  }
  type();
}

</script>

</body>
</html>
