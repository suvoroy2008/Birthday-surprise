<!DOCTYPE html>
<html>
<head>
<title>Birthday Surprise 🎉</title>
<style>
body {
  text-align: center;
  background: black;
  color: white;
  font-family: Arial;
}

#gift {
  font-size: 80px;
  cursor: pointer;
  margin-top: 100px;
  animation: bounce 1s infinite;
}

@keyframes bounce {
  0%,100% {transform: translateY(0);}
  50% {transform: translateY(-20px);}
}

#name, #cake, #message {
  display: none;
}

#name {
  font-size: 40px;
  margin-top: 20px;
  color: cyan;
  text-shadow: 0 0 10px cyan, 0 0 20px cyan;
}

#cake {
  margin-top: 20px;
}

#message {
  font-size: 22px;
  margin-top: 20px;
  padding: 10px;
  max-width: 90%;
  margin-left: auto;
  margin-right: auto;
}
</style>
</head>

<body>

<h1>Click the Gift 🎁</h1>

<div id="gift" onclick="openGift()">🎁</div>

<div id="name"></div>

<div id="cake">
  <h2>🎂 Happy Birthday 🎉</h2>
  <div style="font-size:60px;">🎂 🕯️</div>
</div>

<div id="message"></div>

<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>
function openGift() {
  document.getElementById("gift").style.display = "none";
  document.getElementById("name").style.display = "block";
  document.getElementById("cake").style.display = "block";
  document.getElementById("message").style.display = "block";

  document.getElementById("music").play();

  typeName();
  typeMessage();
}

// 🎉 Name typing
let nameText = "🎉 Happy Birthday Rahit 🎉";
let i = 0;
function typeName() {
  if (i < nameText.length) {
    document.getElementById("name").innerHTML += nameText.charAt(i);
    i++;
    setTimeout(typeName, 100);
  }
}

// ❤️ Shayari (visible + smooth typing)
let msg = `Dear Friend ❤️

Zindagi me kuch log dil ke bahut kareeb ho jaate hain,
Tu unme se ek hai 🙂

Har din khushiyon se bhara rahe,
Aur tera har sapna pura ho ✨

Chahe baat ho ya na ho,
Par meri dua hamesha tere saath rahe 🙏

Tu hamesha muskurata rahe 😊

🎂 Happy Birthday Rahit 🎉`;

let j = 0;

function typeMessage() {
  let speed = 50;

  function type() {
    if (j < msg.length) {
      document.getElementById("message").innerHTML += msg.charAt(j);
      j++;
      
      // thoda thoda slow hoga (smooth feel)
      speed = speed + 1;

      setTimeout(type, speed);
    }
  }

  type();
}
</script>

</body>
</html>
