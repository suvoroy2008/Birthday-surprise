<!DOCTYPE html>
<html lang="en">
<head>

<!-- ✅ Emoji Fix -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday 🎉</title>

<style>
body{
  text-align:center;
  background: linear-gradient(120deg, #000428, #004e92);
  color:white;

  /* ✅ Emoji Support Font */
  font-family: Arial, "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}

/* 🎁 Gift */
#gift{
  font-size:80px;
  margin-top:100px;
  cursor:pointer;
  animation:bounce 1s infinite;
}
@keyframes bounce{
  50%{transform:translateY(-20px);}
}

/* Main */
#main{
  display:none;
}

/* 📸 Photo */
img{
  width:260px;
  border-radius:20px;
  margin-top:20px;
  box-shadow:0 0 20px cyan;
  transition:0.5s;
}

/* ❤️ Message */
p{
  font-size:20px;
  margin:20px;
  line-height:1.6;
}
</style>

</head>

<body>

<h1>Click the Gift 🎁</h1>

<div id="gift" onclick="openGift()">🎁</div>

<div id="main">

<h1>🎉 Happy Birthday Rahit 🎉</h1>

<img id="photo" src="https://i.ibb.co/spTTKr00/photo1.jpg">

<p id="msg"></p>

<button onclick="playMusic()">▶️ Play Music 🎵</button>

</div>

<audio id="music" src="https://cdn.pixabay.com/audio/2022/10/25/audio_946b6f3f4e.mp3"></audio>

<script>

// 📸 Image Links
let images = [
"https://i.ibb.co/spTTKr00/photo1.jpg",
"https://i.ibb.co/YF0B5rvf/photo2.jpg",
"https://i.ibb.co/FqwMbK3Q/photo3.jpg",
"https://i.ibb.co/h12xh6SW/photo4.jpg"
];

// 🎁 Open Gift
function openGift(){
  document.getElementById("gift").style.display="none";
  document.getElementById("main").style.display="block";
  startSlideshow();
  typeMessage();
}

// 📸 Slideshow
let i=0;
function startSlideshow(){
  setInterval(()=>{
    i=(i+1)%images.length;
    document.getElementById("photo").src=images[i];
  },2000);
}

// ❤️ Typing Message
let text = `Dear Friend ❤️

Zindagi me kuch log dil ke bahut kareeb ho jaate hain,
aur tu unme se ek hai 🙂

Har din tere liye khushiyon se bhara ho,
aur tera har sapna zarur pura ho ✨

Tu hamesha muskurata rahe 😊

🎂 Happy Birthday Rahit 🎉`;

let j=0;
function typeMessage(){
  function type(){
    if(j<text.length){
      document.getElementById("msg").innerHTML += text.charAt(j);
      j++;
      setTimeout(type,30);
    }
  }
  type();
}

// 🎵 Music
function playMusic(){
  document.getElementById("music").play();
}

</script>

</body>
</html>
