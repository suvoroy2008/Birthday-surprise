<!DOCTYPE html>
<html>
<head>
<title>Birthday Surprise 🎉</title>

<style>
body {
  text-align: center;
  background: black;
  color: white;
  font-family: Arial;
  overflow: hidden;
}

/* ⭐ Stars background */
.stars {
  width: 100%;
  height: 100%;
  background: transparent;
  position: fixed;
  top: 0;
  left: 0;
}

.stars::after {
  content: "";
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  box-shadow: 
  50px 100px white, 200px 300px white, 400px 150px white,
  600px 250px white, 800px 400px white, 1000px 200px white;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from {opacity: 0.3;}
  to {opacity: 1;}
}

/* 🎁 Gift */
#gift {
  font-size: 80px;
  cursor: pointer;
  margin-top: 100px;
  animation: bounce 1s infinite;
}

@keyframes bounce {
  0%,100% {transform: translateY(0);}
  50% {transform: translateY(-20px);}
}

/* 🎉 Sections */
#name, #cake, #message {
  display: none;
}

#name {
  font-size: 40px;
  margin-top: 20px;
  color: cyan;
  text-shadow: 0 0 10px cyan, 0 0 20px cyan;
}

#cake {
  margin-top: 20px;
  animation: fadeIn 2s;
}

#message {
  font-size: 22px;
  margin-top: 20px;
  padding: 10px;
  max-width: 90%;
  margin-left: auto;
  margin-right: auto;
  animation: fadeIn 2s;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}
</style>
</head>

<body>

<div class="stars"></div>

<h1>Click the Gift 🎁</h1>

<div id="gift" onclick="openGift()">🎁</div>

<div id="name"></div>

<div id="cake">
  <h2>🎂 Happy Birthday 🎉</h2>
  <div style="font-size:60px;">🎂 🕯️</div>
</div>

<div id="message"></div>

<!-- 🎵 Music -->
<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<!-- 🔊 Typing sound -->
<audio id="typeSound" src="https://www.soundjay.com/button/sounds/button-16.mp3"></audio>

<script>
function openGift() {
  document.getElementById("gift").style.display = "none";
  document.getElementById("name").style.display = "block";
  document.getElementById("cake").style.display = "block";
  document.getElementById("message").style.display = "block";

  document.getElementById("music").play();

  typeName();
  typeMessage();
}

// 🎉 Name typing
let nameText = "🎉 Happy Birthday Rahit 🎉";
let i = 0;
function typeName() {
  if (i < nameText.length) {
    document.getElementById("name").innerHTML += nameText.charAt(i);
    i++;
    setTimeout(typeName, 80);
  }
}

// ❤️ Shayari
let msg = `Dear Friend ❤️

Zindagi me kuch log dil ke bahut kareeb ho jaate hain,
Tu unme se ek hai 🙂

Har din khushiyon se bhara rahe,
Aur tera har sapna pura ho ✨

Chahe baat ho ya na ho,
Par meri dua hamesha tere saath rahe 🙏

Tu hamesha muskurata rahe 😊

🎂 Happy Birthday Rahit 🎉`;

let j = 0;

function typeMessage() {
  function type() {
    if (j < msg.length) {
      document.getElementById("message").innerHTML += msg.charAt(j);
      j++;

      // typing sound
      document.getElementById("typeSound").currentTime = 0;
      document.getElementById("typeSound").play();

      setTimeout(type, 30);
    }
  }
  type();
}
</script>

</body>
</html>
