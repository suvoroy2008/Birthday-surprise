<!DOCTYPE html>
<html>
<head>
<title>Birthday Surprise 🎉</title>

<style>
body {
  text-align: center;
  background: black;
  color: white;
  font-family: Arial;
  overflow: hidden;
}

/* Gift */
#gift {
  font-size: 80px;
  cursor: pointer;
  margin-top: 100px;
  animation: bounce 1s infinite;
}

@keyframes bounce {
  0%,100% {transform: translateY(0);}
  50% {transform: translateY(-20px);}
}

#name, #cake, #message, #photoBox, #end {
  display: none;
}

/* Name */
#name {
  font-size: 40px;
  color: cyan;
  text-shadow: 0 0 10px cyan;
}

/* Slideshow */
#photoBox {
  margin-top: 20px;
}

#photoBox img {
  width: 220px;
  border-radius: 15px;
  box-shadow: 0 0 20px white;
  animation: zoom 2s;
}

@keyframes zoom {
  from {transform: scale(0.8);}
  to {transform: scale(1);}
}

/* Message */
#message {
  font-size: 22px;
  margin-top: 20px;
}

/* Ending text */
#end {
  font-size: 28px;
  color: red;
  margin-top: 20px;
  animation: fadeIn 3s;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}
</style>
</head>

<body>

<h1>Click the Gift 🎁</h1>

<div id="gift" onclick="openGift()">🎁</div>

<div id="name"></div>

<div id="photoBox">
  <img id="photo" src="">
</div>

<div id="cake">
  <h2>🎂 Happy Birthday 🎉</h2>
</div>

<div id="message"></div>

<div id="end"></div>

<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>
function openGift() {
  document.getElementById("gift").style.display = "none";
  document.getElementById("name").style.display = "block";
  document.getElementById("photoBox").style.display = "block";
  document.getElementById("cake").style.display = "block";
  document.getElementById("message").style.display = "block";

  document.getElementById("music").play();

  typeName();
  typeMessage();
  startSlideshow();
}

// 🎉 Name
let nameText = "🎉 Happy Birthday Rahit 🎉";
let i = 0;
function typeName() {
  if (i < nameText.length) {
    document.getElementById("name").innerHTML += nameText.charAt(i);
    i++;
    setTimeout(typeName, 80);
  }
}

// ❤️ Shayari
let msg = `Dear Friend ❤️

Zindagi me kuch log dil ke bahut kareeb ho jaate hain,
Tu unme se ek hai 🙂

Har din khushiyon se bhara rahe,
Aur tera har sapna pura ho ✨

Tu hamesha khush rahe 😊

🎂 Happy Birthday Rahit 🎉`;

let j = 0;
function typeMessage() {
  function type() {
    if (j < msg.length) {
      document.getElementById("message").innerHTML += msg.charAt(j);
      j++;
      setTimeout(type, 30);
    }
  }
  type();
}

// 📸 Images (YAHAN LINK DAAL)
let images = [
  "IMG_20250520_133554.jpg",
  "FB_IMG_1773926696914.jpg",
  "IMG-20250615-WA0000.jpg",
  "IMG-20250814-WA0004.jpg",
  "IMG-20231008-WA0012.jpg"
];

let index = 0;

function startSlideshow() {
  let img = document.getElementById("photo");

  function changeImage() {
    img.src = images[index];

    // Agar last photo hai
    if (index === images.length - 1) {
      setTimeout(() => {
        document.getElementById("end").style.display = "block";
        document.getElementById("end").innerHTML = "I miss you bro ❤️";
      }, 1500);
    }

    index = (index + 1) % images.length;

    setTimeout(changeImage, 2000);
  }

  changeImage();
}
</script>

</body>
</html>
