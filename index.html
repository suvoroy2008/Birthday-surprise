<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday 🎉</title>

<style>
body{
  margin:0;
  text-align:center;
  background: linear-gradient(120deg, #000428, #004e92);
  color:white;
  font-family: Arial, "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  overflow:auto;
}

/* 🎁 Gift */
#gift{
  font-size:80px;
  margin-top:120px;
  cursor:pointer;
  animation:bounce 1s infinite;
  position:relative;
  z-index:1;
}
@keyframes bounce{
  50%{transform:translateY(-20px);}
}

/* Main */
#main{
  display:none;
  animation:fadeIn 1.5s ease;
  position:relative;
  z-index:1;
}
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

/* 📸 Photo */
img{
  width:260px;
  border-radius:20px;
  margin-top:20px;
  box-shadow:0 0 25px cyan;
}

/* ❤️ Message */
p{
  font-size:20px;
  margin:20px;
  line-height:1.7;
  white-space:pre-line;
}

/* 💖 CINEMATIC HEARTS */
.heart{
  position:fixed;
  bottom:-10px;
  pointer-events:none;
  z-index:0;
  opacity:0.4;

  animation:floatUp linear forwards;

  text-shadow: 
    0 0 5px #ff4d6d,
    0 0 10px #ff4d6d,
    0 0 20px #ff1a4d;
}

@keyframes floatUp{
  0%{
    transform:translateY(0) scale(1);
    opacity:0.4;
  }
  50%{
    transform:translateY(-50vh) scale(1.3);
    opacity:0.6;
  }
  100%{
    transform:translateY(-110vh) scale(1.6);
    opacity:0;
  }
}

/* 💔 Popup */
#popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:2;
}
#popupBox{
  background:#111;
  padding:25px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 0 20px pink;
}
</style>
</head>

<body>

<h1 style="position:relative; z-index:1;">Click the Gift 🎁</h1>

<div id="gift" onclick="openGift()">🎁</div>

<div id="main">
<h1>🎉 Happy Birthday Rahit 🎂</h1>
<img id="photo" src="https://i.ibb.co/kVsbjz0b/photo1.jpg">
<p id="msg"></p>
</div>

<!-- 💔 Popup -->
<div id="popup">
  <div id="popupBox">
    <h2>💔 I Miss You Rahit</h2>
    <p>Kaash sab pehle jaisa hota... 😔</p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<!-- 🎵 MUSIC -->
<audio id="music" preload="auto" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b30f51be6.mp3" type="audio/mpeg">
</audio>

<script>

// 📸 Images
let images = [
"https://i.ibb.co/kVsbjz0b/photo1.jpg",
"https://i.ibb.co/93g472H1/photo2.jpg",
"https://i.ibb.co/Pv8N9V86/photo3.jpg",
"https://i.ibb.co/Qvk3JjJH/photo4.jpg",
"https://i.ibb.co/234vhxML/photo5.jpg",
"https://i.ibb.co/MDV4CKyy/photo6.jpg",
"https://i.ibb.co/BHvtDP1Q/photo7.jpg"
];

// 🎁 Open Gift
function openGift(){
  document.getElementById("gift").style.display="none";
  document.getElementById("main").style.display="block";

  startMusic();
  startSlideshow();
  typeMessage();
}

// 🎵 Music
function startMusic(){
  let music = document.getElementById("music");
  let playPromise = music.play();

  if (playPromise !== undefined) {
    playPromise.catch(() => {
      document.body.addEventListener("click", () => {
        music.play();
      }, { once: true });
    });
  }
}

// 📸 Slideshow
let i=0;
function startSlideshow(){
  setInterval(()=>{
    i=(i+1)%images.length;
    document.getElementById("photo").src=images[i];
  },2000);
}

// ❤️ Message
let text = `Happy Birthday Rahit 🎂

Dear Friend,

Zindagi me kuch log itne special ho jaate hain ki chahe kitna bhi time beet jaaye, unki jagah kabhi koi nahi le sakta… aur tu unme se ek hai ❤️

Shayad hum ab pehle jaisa baat nahi karte, lekin sach ye hai ki tu aaj bhi mere liye utna hi important hai.

Tere saath bitaye hue wo chhote chhote moments… hasi mazak… sab aaj bhi yaad aate hain 😊

Main bas itna chahta hoon ki teri life me kabhi khushi ki kami na ho, tera har sapna pura ho, aur tu hamesha muskurata rahe ✨

Happy Birthday Rahit ❤️`;

let j=0;
function typeMessage(){
  function type(){
    if(j<text.length){
      document.getElementById("msg").innerHTML += text.charAt(j);
      j++;
      window.scrollTo(0, document.body.scrollHeight);
      setTimeout(type,22);
    } else {
      showPopup();
    }
  }
  type();
}

// 💖 Cinematic Hearts
function startHearts(){
  setInterval(()=>{
    let heart = document.createElement("div");
    heart.className = "heart";

    let hearts = ["💖","❤️","💗","💘"];
    heart.innerHTML = hearts[Math.floor(Math.random()*hearts.length)];

    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (15 + Math.random()*35) + "px";
    heart.style.animationDuration = (5 + Math.random()*5) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),10000);
  },400);
}

// 💔 Popup
function showPopup(){
  document.getElementById("popup").style.display="flex";
}
function closePopup(){
  document.getElementById("popup").style.display="none";
}

// 🔥 Start hearts
startHearts();

</script>

</body>
</html>
